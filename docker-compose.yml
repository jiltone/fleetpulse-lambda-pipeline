# =====================================================================
# FleetPulse - Lambda architecture for ride-hailing fleet operations
# All values in ${...} come from the .env file.
# Phase 1: Kafka (KRaft) + topic setup + Kafka UI + PostgreSQL
# Phase 2: telemetry producer (stream) + expense producer (daily CSV)
# Phase 3: Spark Structured Streaming speed layer
# Phase 4: Airflow batch layer (init + webserver + scheduler)
# Phase 5: FastAPI serving layer
# Phase 6: Pushgateway + Prometheus (alert rules) + Grafana (provisioned dashboards)
# =====================================================================
name: fleetpulse

# Settings shared by all Airflow containers (YAML anchor, reused below with <<: *airflow-common)
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: fleetpulse/airflow:1.0
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor        # runs tasks as local processes; no Celery/Redis
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__WEBSERVER__WORKERS: 2                # fewer gunicorn workers = less RAM
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 30
    # Connection used by the FileSensor (base path "/", so absolute file paths work).
    AIRFLOW_CONN_FS_DEFAULT: '{"conn_type": "fs", "extra": {"path": "/"}}'
    # Our code (common/, batch/) is mounted under /opt/airflow.
    PYTHONPATH: /opt/airflow
    # Absolute paths inside the container (overrides the relative paths in .env).
    SIM_ANCHOR_FILE: /opt/airflow/data/sim_anchor.txt
    LANDING_DIR: /opt/airflow/data/landing
    LAKE_PATH: /opt/airflow/data/lake/raw/telemetry
    REPORTS_DIR: /opt/airflow/reports
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./batch:/opt/airflow/batch
    - ./common:/opt/airflow/common
    - ./data:/opt/airflow/data
    - ./reports:/opt/airflow/reports
  user: "50000:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:

  # ---------------- Ingestion: Apache Kafka in KRaft mode (no ZooKeeper) ----------------
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      # This single node is both the broker and the KRaft controller.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT = for containers (kafka:9092), EXTERNAL = for the laptop (localhost:29092).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Only one broker, so every replication factor must be 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init (with the right partition count).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"   # keep RAM low for a laptop
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot container that creates our topics, then exits.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        KT=/opt/kafka/bin/kafka-topics.sh
        # Main telemetry topic: 3 partitions, events keyed by vehicle_id so
        # all events of one vehicle land in the same partition (= stay in order).
        $$KT --bootstrap-server kafka:9092 --create --if-not-exists \
             --topic ${KAFKA_TELEMETRY_TOPIC} --partitions ${KAFKA_TELEMETRY_PARTITIONS} --replication-factor 1
        # Dead-letter queue for records that fail validation.
        $$KT --bootstrap-server kafka:9092 --create --if-not-exists \
             --topic ${KAFKA_DLQ_TOPIC} --partitions 1 --replication-factor 1
        $$KT --bootstrap-server kafka:9092 --describe --topic ${KAFKA_TELEMETRY_TOPIC}
        $$KT --bootstrap-server kafka:9092 --describe --topic ${KAFKA_DLQ_TOPIC}
        echo "Kafka topics ready."
    restart: "no"

  # Web UI to browse topics, partitions and messages (handy for report screenshots).
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fleetpulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: "-Xms64m -Xmx256m"
    restart: unless-stopped

  # ---------------- Storage: PostgreSQL 16 ----------------
  postgres:
    image: postgres:16.4
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by sql/00_airflow_db.sql to create Airflow's own database.
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run once, on first start, in alphabetical order.
      - ./sql/00_airflow_db.sql:/docker-entrypoint-initdb.d/00_airflow_db.sql:ro
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ---------------- Sources: simulated producers ----------------
  telemetry-producer:
    build:
      context: .
      dockerfile: producers/Dockerfile
    image: fleetpulse/producers:1.0
    command: ["python", "-m", "producers.telemetry_producer"]
    env_file: .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully   # topics must exist first
    volumes:
      - ./data:/app/data          # shared sim-clock anchor file
    ports:
      - "${PRODUCER_METRICS_PORT}:${PRODUCER_METRICS_PORT}"   # Prometheus metrics
    stop_grace_period: 15s        # time to flush buffered events on `docker stop`
    restart: unless-stopped

  expense-producer:
    image: fleetpulse/producers:1.0
    command: ["python", "-m", "producers.expense_batch_producer"]
    env_file: .env
    depends_on:
      - telemetry-producer        # reuses the image built above
    volumes:
      - ./data:/app/data          # writes CSVs to ./data/landing, reads the anchor
    ports:
      - "${EXPENSE_METRICS_PORT}:${EXPENSE_METRICS_PORT}"
    restart: unless-stopped

  # ---------------- Speed layer: Spark Structured Streaming ----------------
  spark-streaming:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    image: fleetpulse/spark-streaming:1.0
    # local[2] = Spark runs inside this one container using 2 CPU cores.
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - /app/streaming/stream_processor.py
    env_file: .env
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data          # Parquet lake, checkpoints, sim-clock anchor
    ports:
      - "${SPARK_UI_PORT}:4040"                                 # Spark UI
      - "${STREAMING_METRICS_PORT}:${STREAMING_METRICS_PORT}"   # Prometheus metrics
    mem_limit: 1800m
    restart: unless-stopped       # on failure, restart and resume from the checkpoints

  # ---------------- Batch layer: Apache Airflow (LocalExecutor) ----------------
  # One-shot: create/upgrade Airflow's metadata tables and the admin login, then exit.
  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_WEB_PORT}:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------- Serving layer: FastAPI ----------------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: fleetpulse/api:1.0
    env_file: .env
    environment:
      SIM_ANCHOR_FILE: /app/data/sim_anchor.txt
      REPORTS_DIR: /app/reports
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro         # sim-clock anchor (read-only)
      - ./reports:/app/reports:ro   # to link the latest HTML report
    ports:
      - "${API_PORT}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------- Observability: Pushgateway + Prometheus + Grafana ----------------
  # Short-lived Airflow tasks push their metrics here; Prometheus scrapes it.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - "${PUSHGATEWAY_PORT}:9091"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d     # small disk footprint for a laptop
      - --web.enable-lifecycle               # allows POST /-/reload after editing rules
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    depends_on:
      - pushgateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    env_file: .env                   # POSTGRES_* for the datasource file
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fleet_operations.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
      - postgres
    restart: unless-stopped

volumes:
  kafka_data:
  postgres_data:
  prometheus_data:
  grafana_data:
